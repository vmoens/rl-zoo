name: Native MuJoCo

on:
  pull_request:
  push:
    branches: [main, "codex/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MUJOCO_GL: egl
      MAX_JOBS: "2"
      SETUPTOOLS_SCM_PRETEND_VERSION: "0.14.0.dev0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1-mesa-dri ffmpeg
      - run: python -m pip install torch==2.11.0 torchcodec==0.16.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-runtime.txt
      - run: python -m pip install --no-build-isolation --no-deps -r requirements-torchrl.txt
      - run: python -m pip install '.[test,video]'
      - run: python -m pytest -q
      - name: Installed package integration
        working-directory: /tmp
        run: |
          python -c "import importlib.util; assert importlib.util.find_spec('examples') is None"
          python -m torchrl_zoo.microduck.train game=football observations=state algorithm=ppo runtime=macbook env.download=true smoke=true policy.opponent_skill=0 ppo.train_team=blue
          for game in tag hide_and_seek ctf pushing relay; do
            mkdir -p "/tmp/smoke-$game"
            (cd "/tmp/smoke-$game" && python -m torchrl_zoo.microduck.train "game=$game" env.download=true smoke=true)
          done
      - name: Installed recurrent sensor integration
        working-directory: /tmp
        timeout-minutes: 6
        run: |
          python -m torchrl_zoo.microduck.train game=tag observations=proprioception_vision observations.sensors.image_size=32 observations.sensors.camera_fps=10 algorithm=ppo_ewma env.download=true smoke=true ppo.reference_kl_coeff=0.1 ppo.train_team=blue policy.opponent_checkpoint=self
          python -m torchrl_zoo.microduck.train game=hide_and_seek observations=proprioception_vision observations.sensors.image_size=32 observations.sensors.camera_fps=10 env.download=true smoke=true
